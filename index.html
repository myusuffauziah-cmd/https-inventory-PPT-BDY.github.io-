<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PILAR AGRI - Inventory Gudang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="container header-flex">
        <div class="title">
            PILAR AGRI
            <br>
            Inventory Gudang POS Bandar Jaya
        </div>
        <div>
            <button class="update-btn" onclick="updateDatabase()">
                🔄 Update Database
            </button>
        </div>
    </div>
</div>

<div class="container">

<!-- DASHBOARD -->
<div class="dashboard">
    <div class="card">
        <h3>Total Item</h3>
        <div class="number" id="total">0</div>
    </div>
    <div class="card">
        <h3>Total Qty Bandar Jaya</h3>
        <div class="number" id="total_qty">0</div>
    </div>
    <div class="card">
        <h3>Stok Tersedia</h3>
        <div class="number" id="stok_tersedia">0</div>
    </div>
    <div class="card">
        <h3>Stok Habis</h3>
        <div class="number" id="stok_habis">0</div>
    </div>
</div>

<!-- SEARCH -->
<div class="search-box">
    <h2>Cari Barang</h2>
    <form onsubmit="event.preventDefault(); cariBarang();">
        <textarea
            id="keyword"
            name="keyword"
            rows="8"
            placeholder="Masukkan Part Number atau Nama Barang...

Contoh:
TC402-25360
TC422-82620
HH164-32430
W9501-35000B

atau cukup ketik nama barang..."></textarea>

        <div class="button
<div class="button-group">
            <button type="submit">🔍 Cari</button>
            <button type="button" class="reset-btn" onclick="resetCari()">♻ Reset</button>
        </div>
    </form>
</div>

<!-- HASIL PENCARIAN -->
<div id="hasil">
    <table>
        <thead><tr><th>Kode</th><th>Nama</th><th>Stok BJ</th><th>Status</th></tr></thead>
        <tbody id="hasil-tabel"></tbody>
    </table>
</div>

</div>

<script src="app.js"></script>  <!-- INI YANG KURANG -->
</body>                         <!-- INI JUGA -->
</html>                         <!-- INI JUGA -->
